<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fe-Spec: Iron Spectrophotometry Calculator</title>
    <style>
        :root { --primary: #2c3e50; --accent: #e67e22; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--primary); display: flex; justify-content: center; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h1 { text-align: center; border-bottom: 2px solid var(--accent); padding-bottom: 10px; margin-bottom: 20px; font-size: 22px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; border: none; cursor: pointer; background: #ddd; border-radius: 6px; font-weight: bold; }
        .tab-btn.active { background: var(--accent); color: white; }
        button#calc-btn { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button#calc-btn:hover { background: #34495e; }
        #result-box { margin-top: 20px; padding: 15px; background: #e8f6f3; border-radius: 6px; text-align: center; display: none; }
        .result-val { font-size: 24px; font-weight: bold; color: #16a085; }
        .note { font-size: 12px; color: #7f8c8d; margin-top: 15px; background: #f9f9f9; padding: 10px; border-left: 3px solid #ccc; }
    </style>
</head>
<body>

<div class="card">
    <h1>🧪 Fe Spectrophotometry</h1>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('curve')">Calibration Curve</button>
        <button class="tab-btn" onclick="switchTab('beer')">Beer-Lambert</button>
    </div>

    <!-- Mode: Calibration Curve (y = mx + c) -->
    <div id="curve-inputs">
        <div class="input-group">
            <label>Absorbance (A)</label>
            <input type="number" id="abs-curve" step="0.001" placeholder="e.g. 0.450">
        </div>
        <div class="input-group">
            <label>Slope (m) from Curve</label>
            <input type="number" id="slope" step="0.0001" placeholder="Abs / concentration">
        </div>
        <div class="input-group">
            <label>Y-Intercept (c)</label>
            <input type="number" id="intercept" step="0.0001" value="0">
        </div>
    </div>

    <!-- Mode: Beer-Lambert (A = εcl) -->
    <div id="beer-inputs" style="display:none;">
        <div class="input-group">
            <label>Absorbance (A)</label>
            <input type="number" id="abs-beer" step="0.001">
        </div>
        <div class="input-group">
            <label>Molar Absorptivity (ε) [L·mol⁻¹·cm⁻¹]</label>
            <input type="number" id="epsilon" value="11100" title="Typical for Fe-phenanthroline at 510nm">
        </div>
        <div class="input-group">
            <label>Path Length (l) [cm]</label>
            <input type="number" id="path" value="1">
        </div>
    </div>

    <div class="input-group">
        <label>Dilution Factor (if any)</label>
        <input type="number" id="dilution" value="1">
    </div>

    <button id="calc-btn" onclick="calculate()">Calculate Concentration</button>

    <div id="result-box">
        <div id="res-molar" class="result-val"></div>
        <div id="res-ppm" style="margin-top:5px; font-weight:bold;"></div>
    </div>

    <div class="note">
        <strong>Standard Method:</strong> 1,10-phenanthroline forms a red-orange complex with Fe²⁺ measured at <b>510 nm</b>.<br>
        Molar Mass of Fe: 55.845 g/mol.
    </div>
</div>

<script>
    let mode = 'curve';

    function switchTab(newMode) {
        mode = newMode;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById('curve-inputs').style.display = mode === 'curve' ? 'block' : 'none';
        document.getElementById('beer-inputs').style.display = mode === 'beer' ? 'block' : 'none';
    }

    function calculate() {
        let concentration = 0; // in M (mol/L)
        const df = parseFloat(document.getElementById('dilution').value) || 1;
        const Fe_Mass = 55.845;

        if (mode === 'curve') {
            const A = parseFloat(document.getElementById('abs-curve').value);
            const m = parseFloat(document.getElementById('slope').value);
            const c = parseFloat(document.getElementById('intercept').value);
            if (!m) return alert("Please enter the slope.");
            // Assumes x is molarity. If your curve is in ppm, result will be in ppm.
            concentration = ((A - c) / m) * df;
        } else {
            const A = parseFloat(document.getElementById('abs-beer').value);
            const eps = parseFloat(document.getElementById('epsilon').value);
            const l = parseFloat(document.getElementById('path').value);
            if (!eps || !l) return alert("Check ε and path length.");
            concentration = (A / (eps * l)) * df;
        }

        const ppm = (concentration * Fe_Mass * 1000).toFixed(3);
        
        document.getElementById('result-box').style.display = 'block';
        document.getElementById('res-molar').innerText = concentration.toExponential(4) + " M";
        document.getElementById('res-ppm').innerText = "≈ " + ppm + " mg/L (ppm) Fe";
    }
</script>

</body>
</html>
